<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADV034 Control</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <section class="viewport">
      <div class="media-layer" id="media-layer">
        <img id="camera-feed" src="/stream.mjpg" alt="Live robot camera" />
        <canvas id="vision-overlay"></canvas>
        <canvas id="aruco-overlay"></canvas>
      </div>

      <div class="feed-label"><span>LIVE · 640×480 · 30 FPS</span><span class="connection" id="connection"><i></i> Connecting</span></div>

      <dl class="status" aria-live="polite">
        <div><dt>Motion</dt><dd id="motion">STOPPED</dd></div>
        <div><dt>Reason</dt><dd id="reason">startup</dd></div>
        <div><dt>Control</dt><dd id="ownership">observer</dd></div>
        <div><dt>Clients</dt><dd id="clients">0</dd></div>
        <div><dt>Vector</dt><dd><span id="forward">0.00</span> / <span id="turn">0.00</span></dd></div>
        <div><dt>Camera</dt><dd><span id="pan">1500 µs</span> / <span id="tilt">1500 µs</span></dd></div>
        <div><dt>ArUco</dt><dd id="aruco-readout">OFF</dd></div>
      </dl>

      <div class="key-overlay" aria-label="Keyboard input status">
        <div><span>DRIVE</span><i data-key="KeyW">W</i><i data-key="KeyA">A</i><i data-key="KeyS">S</i><i data-key="KeyD">D</i></div>
        <div><span>CAMERA</span><i data-key="ArrowUp">↑</i><i data-key="ArrowLeft">←</i><i data-key="ArrowDown">↓</i><i data-key="ArrowRight">→</i></div>
      </div>

      <div class="control-bar">
        <button id="arm">ARM</button>
        <button id="detect-toggle" aria-pressed="false">DETECT OFF</button>
        <button id="stabilize-toggle" aria-pressed="false">STABILIZE OFF</button>
        <button id="aruco-toggle" aria-pressed="false">ARUCO OFF</button>
        <button id="follow-toggle" aria-pressed="false">FOLLOW OFF</button>
        <label for="speed">Speed <output id="speed-value">1800</output></label>
        <input id="speed" type="range" min="500" max="1800" step="50" value="1800" />
        <span class="meter" aria-hidden="true"><i id="speed-meter"></i></span>
        <button id="stop">STOP</button>
      </div>

      <div class="wheel-data" aria-hidden="true">
        <b data-wheel="front-left">0</b><b data-wheel="front-right">0</b>
        <b data-wheel="rear-left">0</b><b data-wheel="rear-right">0</b>
      </div>
    </section>

    <span id="watchdog" hidden>600 ms</span>
  </main>
  <script src="/static/vendor/ort.wasm.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/vision.js" defer></script>
</body>
</html>
